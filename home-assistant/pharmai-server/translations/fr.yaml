configuration:
  allow_registration:
    name: Autoriser la création de partages
    description: Laissez activé le temps de créer votre partage depuis l'app, puis désactivez-le. Les téléphones invités peuvent toujours rejoindre le partage.
  inactive_days:
    name: Effacer les partages inactifs (jours)
    description: Un partage dont aucun téléphone ne s'est connecté depuis ce nombre de jours est effacé du serveur (les téléphones gardent leurs données). 0 = jamais.
  log_level:
    name: Niveau de journalisation
    description: Détail des journaux de l'app. Le contenu des armoires n'y figure jamais.
  brave_search_key:
    name: Clé Brave Search (recherche d'images)
    description: Facultatif. Avec une clé de l'API Brave Search (api-dashboard.search.brave.com), l'app affiche directement des images à toucher pour la photo d'un produit. La clé reste sur le serveur.
network:
  8080/tcp: Port saisi dans l'app PharmAI (Réglages › Partage)
