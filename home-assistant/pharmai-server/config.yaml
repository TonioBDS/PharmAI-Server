# App Home Assistant « PharmAI Server » : https://developers.home-assistant.io/docs/apps/configuration
# La version doit correspondre à une image publiée ghcr.io/toniobds/pharmai-server:<version>
# (publiée à chaque fusion sur main, d'après package.json) ; un test vérifie qu'elle suit la version du serveur.
name: PharmAI Server
version: "0.5.1"
slug: pharmai_server
description: Serveur de partage chiffré de bout en bout pour l'app PharmAI (armoire à pharmacie)
url: https://github.com/TonioBDS/PharmAI-Server/tree/main/home-assistant/pharmai-server
stage: experimental
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Port saisi dans l'app PharmAI (Réglages › Partage)
watchdog: http://[HOST]:[PORT:8080]/health
# Arrêt pendant la sauvegarde : la base SQLite est copiée au repos
backup: cold
options:
  allow_registration: true
  inactive_days: 0
  log_level: info
schema:
  allow_registration: bool
  inactive_days: int(0,)
  log_level: list(debug|info|warn|error)
