# Auto-hébergement (Raspberry Pi, NAS, mini-PC) : un seul conteneur, base SQLite dans un volume.
#   docker compose up -d --build
# Le serveur écoute sur le port 8080 de la machine. Pour l'atteindre hors de chez vous,
# préférez un tunnel chiffré (Tailscale, WireGuard) à l'ouverture d'un port sur la box.
# Sauvegarde : copiez le volume « data » (fichier pharmai.db) ; son contenu est chiffré par les téléphones.
services:
  server:
    build: .
    restart: unless-stopped
    environment:
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - data:/data
    ports:
      - "${PORT:-8080}:8080"

volumes:
  data:
